        x: 0.0
        y: -0.25
        z: 0.0
      orientation:
        x: 0.0
        y: 0.0
        z: 0.0
        w: 1.0
      material:
        friction: 0.8
        restitution: 0.2
        density: 0.0
    - id: "dynamic_cube_1"
      type: "dynamic"
      shape:
        type: "box"
        size:
          x: 1.0
          y: 1.0
          z: 1.0
