simulation:
  name: "Real-Time Physics Simulation"
  version: 1.0
  timestamp: 2024-04-27T12:00:00Z
  global_settings:
    gravity: 
      x: 0.0
      y: -9.81
      z: 0.0
    time_step: 0.016
    max_substeps: 5
    collision_detection:
      method: "GJK"
      margin: 0.01
    broad_phase:
      algorithm: "SAP"
      parameters:
        cell_size: 1.0
        max_objects_per_cell: 10
    solver:
      type: "Sequential Impulse"
      iterations: 10
      tolerance: 0.001
    damping:
      linear: 0.01
      angular: 0.02
    sleep:
      enabled: true
      linear_threshold: 0.05
      angular_threshold: 0.05
      time_to_sleep: 1.0
  entities:
