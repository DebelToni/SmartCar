[Shader]
Name=AI_Shader_Shading
Type=Complex
Version=1.0

[Settings]
EnableAdvancedFeatures=True
MaxRecursionDepth=8
UseGlobalIllumination=True
UseRayTracing=True
EnableRefractions=True
EnableReflections=True
SamplingRate=64
AntiAliasing=MSAA16
OutputResolution=1920x1080
ColorSpace=ACEScg
ApplyToneMapping=True
ToneMappingMethod=ACES
Exposure=1.2
Gamma=2.2
UseHDR=True
BloomIntensity=0.8
ChromaticAberration=True
Vignetting=False
DepthOfField=True
FocusDistance=10.0
ApertureSize=0.5
FocalLength=35.0
MotionBlur=True
ShutterSpeed=1/60

[Textures]
DiffuseMap=Textures/Materials/wood_diffuse.png
NormalMap=Textures/Materials/wood_normal.png
RoughnessMap=Textures/Materials/wood_roughness.png
SpecularMap=Textures/Materials/wood_specular.png
EmissionMap=Textures/Materials/wood_emission.png
OpacityMap=Textures/Materials/wood_opacity.png
DisplacementMap=Textures/Materials/wood_displacement.png
ReflectivityMap=Textures/Materials/wood_reflectivity.png

[Lighting]
UseIBL=True
HDRTexture=Textures/HDR/sky.hdr
SunDirection=0.0,1.0,0.0
SunIntensity=1.5
AmbientLightColor=0.1,0.1,0.1
AmbientOcclusionStrength=0.7
ShadowMapSize=4096
ShadowBias=0.005
UseSoftShadows=True
ShadowSoftness=0.3
GlobalLightIntensity=1.0
UseAreaLights=True
AreaLightSize=2.0
AreaLightIntensity=2.0

[Materials]
MaterialID=Mat_Wood
DiffuseColor=0.4,0.2,0.1
Roughness=0.45
Metallic=0.0
Specular=0.5
EmissionColor=0.0,0.0,0.0
Opacity=1.0
DisplacementStrength=0.02
Reflectivity=0.3

[Materials]
MaterialID=Mat_Metal
DiffuseColor=0.6,0.6,0.6
Roughness=0.2
Metallic=1.0
Specular=0.9
EmissionColor=0.0,0.0,0.0
Opacity=1.0
DisplacementStrength=0.0
Reflectivity=0.8

[Shaders]
VertexShader=Shaders/vertex_shader_ai.glsl
FragmentShader=Shaders/fragment_shader_ai.glsl
ComputeShader=Shaders/compute_shader_ai.glsl

[ShadingModels]
ModelName=PhysicallyBasedRendering
UseMicrofacet=True
BRDFType=DisneyDiffuse
SpecularBRDF=GGX
Clearcoat=0.05
ClearcoatRoughness=0.03
Anisotropy=0.2
AnisotropyRotation=45.0
SubsurfaceScattering=False
SubsurfaceColor=1.0,0.8,0.6

[ProceduralTextures]
EnableProceduralTextures=True
PerlinNoiseScale=4.0
WorleyNoiseCells=8
FractalBrownianMotion=True
FractalOctaves=5
FractalLacunarity=2.0
Turbulence=True
TurbulenceStrength=0.3
CellularTextureScale=3.0

[Baking]
EnableBaking=False
BakeResolution=1024
BakingPasses=3
OutputPath=BakedTextures/
BakedTextureFormat=PNG
BakeDiffuse=True
BakeNormal=True
BakeRoughness=True
BakeSpecular=True
BakeAO=True

[PostProcessing]
EnableBloom=True
BloomThreshold=1.0
BloomIntensity=0.8
EnableVignetting=False
VignettingStrength=0.5
EnableChromaticAberration=True
AberrationAmount=0.02
EnableColorGrading=True
ColorGradingCurve=Textures/ColorGrading/curve.json
SharpenAmount=0.2
DenoiseStrength=0.4

[Animation]
EnableMotionBlur=True
MotionBlurSamples=16
UseKeyframes=True
FrameStart=0
FrameEnd=240
FrameRate=24
InterpolationMethod=Linear
LoopAnimation=True

[Debug]
EnableDebugMode=False
ShowNormals=False
ShowWireframe=False
ShowBoundingBoxes=False
LogLevel=Info
LogFile=logs/shader_debug.log

[Runtime]
EnableRealTimePreview=True
PreviewResolution=1280x720
RefreshRate=60
UseGPUAcceleration=True
GPUDeviceID=0
CUDAComputeCapability=7.5
OpenCLPlatform=Intel_OpenCL
NumThreads=8
MemoryCacheSize=2048

[Advanced]
EnableRayMarching=True
RayMarchSteps=128
MaxDistance=100.0
UseVolumetrics=True
VolumetricSamples=64
FogDensity=0.05
FogColor=0.6,0.7,0.8
CloudLayerCount=3
CloudOpacity=0.7
CloudCoverage=0.5
SoftParticles=True
ParticleSize=0.1
ParticleCount=10000
TessellationFactor=4
DisplacementMapping=True
Subdivisions=16
UseSSAO=True
SSAOStrength=1.0
SSAORadius=2.0
AmbientLightProbe=Textures/Probes/probe_ambient.hdr
RefractionIndex=1.5
AbsorptionCoefficient=0.1,0.1,0.1
SpecularIBL=True
AnisotropicSpecular=True
FresnelEffect=True
FresnelIOR=1.45
EnergyConservation=True
BackfaceCulling=False
CullMode=Back
UseScreenSpaceReflections=True
SSREnabled=True
SSRQuality=High
SSRMaxDistance=50.0
SSRIntensity=0.7
SubsurfaceScatteringSamples=32
SuperSampling=2x

[Installer]
RequiresAdminRights=True
InstallPath=C:/Program Files/AI_Shader/
CreateShortcut=True
StartOnBoot=False
LicenseAgreementAccepted=True
AutoUpdate=True
UpdateServer=https://updates.ai-shader.com
UpdateCheckInterval=7

[Metadata]
Author=AIShaderDev
Created=2023-10-23
LastModified=2023-10-23
Description=Complex AI-based shading shader configuration with advanced features for realistic rendering and procedural effects.
Keywords=AI, shading, real-time, PBR, ray tracing, volumetrics, procedural textures
License=Commercial